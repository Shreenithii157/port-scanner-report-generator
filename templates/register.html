<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | Sentinel Security</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(
                    circle at top right,
                    #1e293b,
                    #0f172a 45%,
                    #020617
                );
        }

        .auth-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 25px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 42px;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            font-size: 48px;
        }

        .brand h1 {
            margin: 8px 0 0;
            font-size: 28px;
            color: #0f172a;
        }

        .brand p {
            color: #64748b;
            font-size: 14px;
        }

        .auth-title {
            margin-bottom: 22px;
        }

        .auth-title h2 {
            margin-bottom: 6px;
            color: #111827;
        }

        .auth-title p {
            margin: 0;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .register-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0f172a;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .register-button:hover {
            background: #1e293b;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
        }

        .auth-footer a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .error-message {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .password-note {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
        }

    </style>

</head>


<body>

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="brand">

            <div class="brand-icon">
                🛡️
            </div>

            <h1>
                SENTINEL SECURITY
            </h1>

            <p>
                Network Security Assessment Platform
            </p>

        </div>


        <div class="auth-title">

            <h2>
                Create your account
            </h2>

            <p>
                Set up your security analyst profile
            </p>

        </div>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST"
              action="{{ url_for('register') }}">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                    minlength="3"
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a strong password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

                <div class="password-note">
                    Minimum 8 characters recommended.
                </div>

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

            </div>


            <button
                type="submit"
                class="register-button">

                🛡️ Create Secure Account

            </button>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Sign in
            </a>

        </div>

    </div>

</div>

</body>

</html>
