<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign In | Sentinel Security</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(
                    circle at top right,
                    #1e293b,
                    #0f172a 45%,
                    #020617
                );
        }

        .auth-wrapper {
            width: 100%;
            max-width: 460px;
            padding: 25px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 42px;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            font-size: 52px;
            margin-bottom: 8px;
        }

        .brand h1 {
            margin: 0;
            font-size: 30px;
            color: #0f172a;
        }

        .brand p {
            margin-top: 8px;
            color: #64748b;
            font-size: 14px;
        }

        .auth-title {
            margin-bottom: 22px;
        }

        .auth-title h2 {
            margin-bottom: 6px;
            color: #111827;
        }

        .auth-title p {
            color: #64748b;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0f172a;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #1e293b;
            transform: translateY(-1px);
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 14px;
        }

        .auth-footer a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 25px;
            padding: 12px 15px;
            border-radius: 10px;
            background: #f1f5f9;
            color: #475569;
            font-size: 12px;
            text-align: center;
        }

        .error-message {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .success-message {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="brand">

            <div class="brand-icon">
                🛡️
            </div>

            <h1>
                SENTINEL SECURITY
            </h1>

            <p>
                Network Security Assessment Platform
            </p>

        </div>


        <div class="auth-title">

            <h2>
                Sign in
            </h2>

            <p>
                Access your security dashboard
            </p>

        </div>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        {% if message %}

        <div class="success-message">
            {{ message }}
        </div>

        {% endif %}


        <form method="POST"
              action="{{ url_for('login') }}">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="login-button">

                🔐 Sign In

            </button>

        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create account
            </a>

        </div>


        <div class="security-note">

            🔒 Your password is securely hashed.
            Never share your credentials.

        </div>

    </div>

</div>

</body>

</html>
